<form [formGroup]="form" class="entity-form" (ngSubmit)="save()">
  @for (field of data.fields; track field.key) {
    <div class="entity-field">
      <label [for]="field.key">
        {{ field.label }}@if (field.required) {<span class="req">*</span>}
      </label>
      @if (field.type === 'select') {
        <p-select
          [id]="field.key"
          [formControlName]="field.key"
          [options]="field.options ?? []"
          optionLabel="label"
          optionValue="value"
          placeholder="Select an option"
          [showClear]="!field.required"
        />
      } @else if (field.type === 'textarea') {
        <textarea
          pTextarea
          [id]="field.key"
          rows="4"
          [formControlName]="field.key"
          [placeholder]="field.label"
        ></textarea>
      } @else if (field.type === 'icon') {
        <div class="icon-picker">
          @for (option of field.options ?? []; track option.value) {
            <button
              type="button"
              class="icon-option"
              [class.selected]="form.get(field.key)?.value === option.value"
              [pTooltip]="option.label"
              tooltipPosition="top"
              [attr.aria-label]="option.label"
              (click)="form.get(field.key)?.setValue(option.value)"
            >
              @if (iconFor(field, option.value); as icon) {
                <ng-container *ngComponentOutlet="icon" />
              } @else {
                <span class="icon-fallback">{{ option.label.charAt(0).toUpperCase() }}</span>
              }
            </button>
          }
        </div>
      } @else {
        <input
          pInputText
          [id]="field.key"
          [type]="field.type === 'number' ? 'number' : field.type === 'date' ? 'date' : field.type === 'time' ? 'time' : field.type === 'email' ? 'email' : field.type === 'password' ? 'password' : 'text'"
          [formControlName]="field.key"
          [placeholder]="field.label"
        />
      }
    </div>
  }
</form>

<div class="entity-actions">
  <button pButton type="button" label="Cancel" class="p-button-text" (click)="ref.close()"></button>
  <button pButton type="button" label="Save" [disabled]="form.invalid" (click)="save()"></button>
</div>
