<section class="page">
  <div class="page-head"><div><h1>Collections</h1><p>Record received money</p></div></div>
  <mat-card><mat-card-content>
    <form class="grid" (ngSubmit)="save()">
      <mat-form-field>
        <mat-label>Person Name</mat-label>
        <mat-select [(ngModel)]="memberId" name="memberId" required>
          @for (m of members(); track m.id) { <mat-option [value]="m.id">{{ m.name }}</mat-option> }
        </mat-select>
      </mat-form-field>
      <mat-form-field><mat-label>Money</mat-label><input matInput type="number" min="0" step="0.01" [(ngModel)]="amount" name="amount" required /></mat-form-field>
      <mat-form-field>
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" [ngModel]="dateValue" (ngModelChange)="setDate($event)" name="date" required />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <button mat-flat-button color="primary">Save Collection</button>
    </form>
  </mat-card-content></mat-card>
  <mat-card><mat-card-content>
    <table mat-table [dataSource]="collections()">
      <ng-container matColumnDef="member"><th mat-header-cell *matHeaderCellDef>Person</th><td mat-cell *matCellDef="let row">{{ row.members?.name }}</td></ng-container>
      <ng-container matColumnDef="amount"><th mat-header-cell *matHeaderCellDef>Money</th><td mat-cell *matCellDef="let row">{{ row.amount | number:'1.0-2' }}</td></ng-container>
      <ng-container matColumnDef="date"><th mat-header-cell *matHeaderCellDef>Date</th><td mat-cell *matCellDef="let row">{{ row.date }}</td></ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </mat-card-content></mat-card>
</section>
