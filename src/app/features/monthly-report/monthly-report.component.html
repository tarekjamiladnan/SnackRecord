<section class="page">
  <div class="page-head"><div><h1>Monthly Report</h1><p>Download the monthly report as PDF or Excel</p></div></div>
  <mat-card><mat-card-content>
    <div class="toolbar">
      <mat-form-field><mat-label>Month</mat-label><input matInput type="number" [(ngModel)]="month" min="1" max="12" /></mat-form-field>
      <mat-form-field><mat-label>Year</mat-label><input matInput type="number" [(ngModel)]="year" /></mat-form-field>
      <button mat-flat-button color="primary" (click)="loadAndDownload(true)"><i class="pi pi-file-pdf"></i>Download PDF</button>
      <button mat-flat-button color="primary" (click)="loadAndDownload(false)"><i class="pi pi-file-excel"></i>Download XLSX</button>
    </div>
  </mat-card-content></mat-card>
</section>
