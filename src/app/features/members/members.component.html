<section class="page">
  <div class="page-head"><div><h1>Members</h1><p>{{ count() }} records</p></div><button mat-flat-button color="primary" (click)="open()"><i class="pi pi-plus"></i>Add Member</button></div>
  <mat-card><mat-card-content>
    <mat-form-field class="search"><mat-label>Search</mat-label><i class="pi pi-search" matPrefix></i><input matInput #q (input)="search.set(q.value); load()" /></mat-form-field>
    <table mat-table [dataSource]="data()">
      @for (column of columns; track column) {
        <ng-container [matColumnDef]="column"><th mat-header-cell *matHeaderCellDef>{{ column | titlecase }}</th><td mat-cell *matCellDef="let row">{{ row[column] }}</td></ng-container>
      }
      <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let row" class="actions">
        <button mat-button (click)="open(row)"><i class="pi pi-pencil"></i>Edit</button>
        @if (auth.profile()?.role === 'admin') { <button mat-button color="warn" (click)="delete(row)"><i class="pi pi-trash"></i>Delete</button> }
      </td></ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [length]="count()" [pageSize]="pageSize()" (page)="page.set($event.pageIndex); pageSize.set($event.pageSize); load()" />
  </mat-card-content></mat-card>
</section>
