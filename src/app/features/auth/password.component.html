<section class="auth">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo"><img src="phantom-logo.svg" alt="Phantom Snack Record" /></div>
      <h1>{{ title() }}</h1>
      <p>
        @if (mode() === 'forgot') {
          Enter your email to receive a reset link
        } @else {
          Choose a new password
        }
      </p>
    </div>

    <form [formGroup]="form" class="auth-form" (ngSubmit)="submit()">
      @if (mode() === 'forgot') {
        <div>
          <label class="field-label" for="email">Email</label>
          <input pInputText id="email" type="email" formControlName="email" placeholder="you@example.com" autofocus />
        </div>
      } @else {
        <div>
          <label class="field-label" for="password">New password</label>
          <input pInputText id="password" type="password" formControlName="password" placeholder="At least 6 characters" autofocus />
        </div>
      }

      <button pButton type="submit" class="auth-btn" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span>
        } @else {
          <svg lucideKeyRound /> {{ title() }}
        }
      </button>
    </form>

    <a class="auth-link" routerLink="/auth/login">Back to login</a>
  </div>
</section>
