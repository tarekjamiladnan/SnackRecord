<section class="auth">
  <mat-card>
    <mat-card-header>
      <img mat-card-avatar src="phantom-logo.svg" alt="Phantom Snack Record" />
      <mat-card-title>{{ title() }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        @if (mode() === 'forgot') {
          <mat-form-field><mat-label>Email</mat-label><input matInput formControlName="email" /></mat-form-field>
        } @else {
          <mat-form-field><mat-label>New password</mat-label><input matInput type="password" formControlName="password" /></mat-form-field>
        }
        <button mat-flat-button color="primary" [disabled]="form.invalid || loading()"><i class="pi pi-key"></i>{{ title() }}</button>
      </form>
    </mat-card-content>
    <mat-card-actions><a mat-button routerLink="/auth/login">Back to login</a></mat-card-actions>
  </mat-card>
</section>
