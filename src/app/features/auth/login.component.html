<section class="auth">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo"><img src="phantom-logo.svg" alt="Phantom Snack Record" /></div>
      <h1>Snack Record</h1>
      <p>Sign in to continue</p>
    </div>

    <form [formGroup]="form" class="auth-form" (ngSubmit)="login()">
      <div>
        <label class="field-label" for="email">Email</label>
        <input pInputText id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" autofocus />
      </div>
      <div>
        <label class="field-label" for="password">Password</label>
        <div class="password-wrap">
          <input pInputText id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
          <button pButton type="button" class="ghost-button toggle-password" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) { <svg lucideEyeOff /> } @else { <svg lucideEye /> }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error"><svg lucideTriangleAlert /><span>{{ error() }}</span></div>
      }

      <button pButton type="submit" class="auth-btn" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span>
        } @else {
          <svg lucideLogIn /> Login
        }
      </button>
    </form>

    <a class="auth-link" routerLink="/auth/forgot-password">Forgot password?</a>
  </div>
</section>
