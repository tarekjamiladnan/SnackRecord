<section class="auth">
  <div class="auth-card animate-scale-in">
    <div class="auth-head">
      <div class="brand-logo"><img src="phantom-logo.svg" alt="Phantom Snack Record" /></div>
      <h1>Welcome back</h1>
      <p>Sign in to your Snack Record account</p>
    </div>

    <form [formGroup]="form" class="auth-form" (ngSubmit)="login()">
      <div class="field">
        <label class="field-label" for="email">Email address</label>
        <div class="field-input-wrap">
          <svg class="field-icon" lucideMail />
          <input pInputText id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" autofocus />
        </div>
      </div>

      <div class="field">
        <div class="field-label-row">
          <label class="field-label" for="password">Password</label>
          <a class="forgot-link" routerLink="/auth/forgot-password">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <svg class="field-icon" lucideLock />
          <input pInputText id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-password" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) { <svg lucideEyeOff /> } @else { <svg lucideEye /> }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error"><svg lucideTriangleAlert /><span>{{ error() }}</span></div>
      }

      <button pButton type="submit" class="auth-btn" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span>
        } @else {
          <svg lucideLogIn /> Sign in
        }
      </button>
    </form>

    <p class="auth-foot">
      Need an account? <a routerLink="/auth/login">Contact the manager</a>
    </p>
  </div>
</section>
