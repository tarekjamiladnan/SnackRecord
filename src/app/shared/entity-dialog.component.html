<form [formGroup]="form" class="entity-form" (ngSubmit)="save()">
  @for (field of data.fields; track field.key) {
    <div class="entity-field">
      <label [for]="field.key">
        {{ field.label }}@if (field.required) {<span class="req">*</span>}
      </label>
      @if (field.type === 'select') {
        <p-select
          [id]="field.key"
          [formControlName]="field.key"
          [options]="field.options ?? []"
          optionLabel="label"
          optionValue="value"
          placeholder="Select an option"
          [showClear]="!field.required"
        />
      } @else {
        <input
          pInputText
          [id]="field.key"
          [type]="field.type === 'number' ? 'number' : field.type === 'date' ? 'date' : 'text'"
          [formControlName]="field.key"
          [placeholder]="field.label"
        />
      }
    </div>
  }
</form>

<div class="entity-actions">
  <button pButton type="button" label="Cancel" class="p-button-text" (click)="ref.close()"></button>
  <button pButton type="button" label="Save" [disabled]="form.invalid" (click)="save()"></button>
</div>
