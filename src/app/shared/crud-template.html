<section class="page">
  <div class="page-head">
    <div>
      <h1>{{ title }}s</h1>
      <p class="page-sub">{{ count() }} records</p>
    </div>
    <div class="page-actions">
      <button pButton (click)="open()"><svg lucidePlus /> Add {{ title }}</button>
    </div>
  </div>

  <p-card>
    <div class="toolbar">
      <p-iconfield class="search">
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText #q [value]="search()" (input)="search.set(q.value); load()" placeholder="Search {{ title }}s…" />
      </p-iconfield>
    </div>

    @if (loading()) {
      <div class="loading"><p-progressspinner styleClass="w-2rem h-2rem" /></div>
    } @else {
      <p-table
        [value]="data()"
        [paginator]="true"
        [rows]="pageSize()"
        [totalRecords]="count()"
        [rowsPerPageOptions]="[10, 25, 50]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first}–{last} of {totalRecords}"
        (onPage)="onPage($event)"
      >
        <ng-template pTemplate="header">
          <tr>
            @for (column of columns; track column) {
              <th>{{ column.replace('_', ' ') | titlecase }}</th>
            }
            <th class="text-right">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr>
            @for (column of columns; track column) {
              <td>{{ row[column] }}</td>
            }
            <td>
              <div class="row-actions">
                <button pButton type="button" class="p-button-text" pTooltip="Edit" (click)="open(row)"><svg lucidePencil /></button>
                <button pButton type="button" class="p-button-danger" pTooltip="Delete" (click)="delete(row)"><svg lucideTrash2 /></button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td [attr.colspan]="displayedColumns.length" class="empty-state">
              <div class="empty-art"><svg lucideClipboardList /></div>
              <b>Nothing here yet</b>
              <span>No {{ title }} records found.</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    }
  </p-card>
</section>
